name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DA-Speaker.slnx
      - name: Build and test
        run: dotnet test DA-Speaker.slnx -c Release --no-restore -p:UseSharedCompilation=false -m:1 -nodeReuse:false --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Publish Windows app
        run: dotnet publish src/DA-Speaker/DA-Speaker.csproj -c Release -r win-x64 -p:SelfContained=false -p:PublishSelfContained=false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:UseSharedCompilation=false -o artifacts/release
      - name: Include license and user guide
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md artifacts/release/
          Copy-Item docs/usage.md artifacts/release/USER-GUIDE.md
      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DA-Speaker-win-x64
          path: artifacts/release/
          if-no-files-found: error
      - name: Upload test results and UI captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            artifacts/test-results/
            artifacts/design/
          if-no-files-found: warn
